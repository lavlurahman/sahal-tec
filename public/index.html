<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAHAL TEC - Professional Workspace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans Bengali -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MathJax Configuration for Converter -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; background-color: #cbd5e1; overflow: hidden; }
        .editor-page {
            width: 100%;
            max-width: 21cm;
            min-height: 29.7cm;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin: 0 auto;
            padding: 2.54cm;
            outline: none;
        }
        /* Custom Scrollbar for inner containers */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="flex h-screen w-screen overflow-hidden bg-gray-200">

    <!-- Sidebar: Folder & File Management -->
    <aside class="w-64 bg-[#111827] text-white flex flex-col h-full shrink-0 transition-all duration-300 z-20">
        <div class="p-5 border-b border-gray-800">
            <h2 class="text-xl font-bold tracking-wide">SAHAL TEC</h2>
        </div>
        
        <div class="p-4 border-b border-gray-800 flex items-center gap-3 cursor-pointer hover:bg-gray-800 transition">
            <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center font-bold text-white shadow-md">MR</div>
            <div>
                <p class="text-sm font-semibold">Mas Lavlu Rahman</p>
                <p class="text-xs text-gray-400">Pro Plan</p>
            </div>
        </div>

        <div class="p-4 flex-grow overflow-y-auto">
            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded text-sm font-semibold flex items-center justify-center gap-2 mb-6 shadow-sm transition">
                <i class="fas fa-plus"></i> নতুন ফোল্ডার
            </button>
            <ul class="space-y-3 text-sm">
                <li class="cursor-pointer hover:bg-gray-800 p-2 rounded flex items-center gap-3 text-gray-300 transition">
                    <i class="fas fa-folder text-yellow-500 text-lg"></i> Physics Notes (HSC)
                </li>
                <li class="cursor-pointer hover:bg-gray-800 p-2 rounded flex items-center gap-3 text-gray-300 transition">
                    <i class="fas fa-folder text-yellow-500 text-lg"></i> Math Question Bank
                </li>
                <li class="cursor-pointer hover:bg-gray-800 p-2 rounded flex items-center gap-3 text-gray-300 transition">
                    <i class="fas fa-folder text-yellow-500 text-lg"></i> Chemistry Diagrams
                </li>
            </ul>
        </div>
        
        <div class="p-4 border-t border-gray-800">
            <button class="w-full text-left text-sm text-gray-400 hover:text-white flex items-center gap-2 transition">
                <i class="fas fa-sign-out-alt"></i> লগআউট
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full min-w-0">
        
        <!-- Top Toolbar -->
        <header class="bg-white border-b border-gray-200 shadow-sm z-10 shrink-0">
            <!-- Top Row: File Name & Action Buttons -->
            <div class="flex justify-between items-center px-4 md:px-6 py-3 border-b border-gray-100">
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <input type="text" value="Untitled Document" class="text-lg md:text-xl font-bold text-gray-700 outline-none hover:bg-gray-50 px-2 py-1 rounded w-full md:w-64 border-b border-transparent focus:border-blue-500 transition">
                </div>
                
                <!-- 3-Line Navigation Menu (Hamburger) -->
                <div class="relative inline-block text-left shrink-0 ml-4">
                    <button onclick="toggleDropdown(event)" class="p-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition focus:outline-none shadow-sm border border-gray-200">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    
                    <div id="action-dropdown" class="hidden absolute right-0 mt-2 w-56 origin-top-right bg-white border border-gray-200 divide-y divide-gray-100 rounded-lg shadow-xl outline-none z-50 overflow-hidden">
                        <div class="py-1 bg-gray-50">
                            <button id="mode-toggle-btn" onclick="toggleMode()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-indigo-700 hover:bg-indigo-100 font-bold transition">
                                <i class="fas fa-robot w-5 text-center text-lg"></i> এআই কনভার্টার চালু করুন
                            </button>
                        </div>
                        <div class="py-1">
                            <button class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-100 font-semibold transition">
                                <i class="fas fa-eye w-5 text-center text-lg text-gray-500"></i> প্রিভিউ
                            </button>
                            <button class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-blue-600 hover:bg-blue-50 font-semibold transition">
                                <i class="fas fa-save w-5 text-center text-lg"></i> সেভ করুন
                            </button>
                        </div>
                        <div class="py-1">
                            <!-- Download Button connected to Backend -->
                            <button id="download-btn" onclick="downloadDocx()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-green-600 hover:bg-green-50 font-semibold transition">
                                <i class="fas fa-download w-5 text-center text-lg"></i> <span id="download-text">ডাউনলোড</span>
                            </button>
                            <button class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-gray-800 hover:bg-gray-100 font-semibold transition">
                                <i class="fas fa-print w-5 text-center text-lg"></i> প্রিন্ট
                            </button>
                        </div>
                        <div class="py-1">
                            <button class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-purple-600 hover:bg-purple-50 font-semibold transition">
                                <i class="fas fa-share-alt w-5 text-center text-lg"></i> শেয়ার
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Row: Formatting Tools -->
            <div id="formatting-toolbar" class="flex flex-wrap items-center gap-2 px-4 md:px-6 py-2.5 bg-white text-gray-700 border-b border-gray-200">
                <select class="border border-gray-300 rounded px-2 py-1.5 text-sm bg-white outline-none cursor-pointer focus:ring-1 focus:ring-blue-500">
                    <option>Normal Text</option>
                    <option>Heading 1</option>
                    <option>Heading 2</option>
                </select>
                <div class="hidden md:block w-px h-6 bg-gray-300 mx-1"></div>
                <button class="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center font-serif text-lg font-bold transition">B</button>
                <button class="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center font-serif text-lg italic transition">I</button>
                <button class="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center font-serif text-lg underline transition">U</button>
                <button class="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center text-red-500 font-serif text-lg font-bold transition">A</button>
                <button class="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center text-yellow-500 transition"><i class="fas fa-highlighter"></i></button>
                <div class="hidden md:block w-px h-6 bg-gray-300 mx-1"></div>
                <button class="px-2 py-1.5 text-sm font-bold bg-blue-50 text-blue-600 rounded hover:bg-blue-100 flex items-center gap-1.5 transition">
                    <i class="fas fa-square-root-variable"></i> সমীকরণ
                </button>
                <button class="px-2 py-1.5 text-sm font-bold bg-indigo-50 text-indigo-600 rounded hover:bg-indigo-100 flex items-center gap-1.5 transition">
                    <i class="fas fa-chart-line"></i> চিত্র
                </button>
                <button class="px-2 py-1.5 text-sm font-bold bg-teal-50 text-teal-600 rounded hover:bg-teal-100 flex items-center gap-1.5 transition">
                    <i class="fas fa-table"></i> টেবিল
                </button>
            </div>
        </header>

        <!-- Workspace Area -->
        <div class="flex-1 relative bg-[#cbd5e1] overflow-hidden">
            
            <!-- MODE 1: Direct Editor View -->
            <div id="editor-view" class="h-full w-full overflow-y-auto flex justify-center py-8 px-4">
                <div contenteditable="true" class="editor-page text-lg leading-relaxed text-justify" placeholder="এখানে সরাসরি টাইপ করা শুরু করুন...">
                    <h1 style="font-size: 26px; font-weight: bold; text-align: center; margin-bottom: 20px;">পদার্থবিজ্ঞান: গতির সমীকরণ</h1>
                    <p class="text-center text-gray-700">এখানে আপনি সরাসরি টাইপ করতে পারবেন। উপরের টুলবার থেকে সমীকরণ, গ্রাফ বা টেবিল যুক্ত করা যাবে।</p>
                </div>
            </div>

            <!-- MODE 2: AI Chat Converter View (True Split Screen) -->
            <div id="converter-view" class="hidden h-full w-full flex flex-col md:flex-row gap-4 p-4">
                
                <!-- Left: Input Area -->
                <div class="w-full md:w-1/2 h-full flex flex-col bg-white rounded-xl shadow border border-gray-300 overflow-hidden">
                    <div class="bg-gray-100 p-3 border-b border-gray-300 flex justify-between items-center shrink-0">
                        <label class="font-bold text-gray-700 text-sm ml-2">📝 এআই টেক্সট বা ল্যাটেক্স পেস্ট করুন</label>
                        <div class="flex gap-2">
                            <button onclick="pasteText()" class="text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded font-bold hover:bg-blue-200 transition">পেস্ট</button>
                            <button onclick="document.getElementById('ai-input').value=''; document.getElementById('ai-output').innerHTML=''" class="text-xs bg-red-100 text-red-700 px-3 py-1.5 rounded font-bold hover:bg-red-200 transition">ক্লিয়ার</button>
                        </div>
                    </div>
                    <textarea id="ai-input" class="w-full h-full flex-grow p-4 focus:outline-none resize-none font-mono text-base bg-gray-50 overflow-y-auto" placeholder="ChatGPT বা অন্য যেকোনো AI থেকে কপি করা টেক্সট এখানে পেস্ট করুন..."></textarea>
                </div>

                <!-- Right: Live Preview A4 Paper -->
                <div class="w-full md:w-1/2 h-full flex flex-col bg-[#cbd5e1] rounded-xl shadow-inner border border-gray-300 overflow-hidden">
                    <div class="bg-gray-200 p-3 border-b border-gray-300 flex justify-center items-center shrink-0 shadow-sm z-10">
                        <label class="font-bold text-gray-700 text-sm">👁️ লাইভ আউটপুট প্রিভিউ</label>
                    </div>
                    <!-- This specific div scrolls independently -->
                    <div class="flex-grow overflow-y-auto p-4 flex justify-center">
                        <div id="ai-output" class="editor-page text-lg leading-relaxed text-justify mb-10">
                            <!-- Rendered Math/Text will appear here -->
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <script>
        // Dropdown Toggle Logic
        function toggleDropdown(event) {
            if(event) event.stopPropagation(); 
            const dropdown = document.getElementById('action-dropdown');
            dropdown.classList.toggle('hidden');
        }

        // Close dropdown when clicking outside
        window.onclick = function(event) {
            const dropdown = document.getElementById('action-dropdown');
            if (!event.target.closest('.relative')) {
                if (!dropdown.classList.contains('hidden')) {
                    dropdown.classList.add('hidden');
                }
            }
        }

        // Mode Toggle Logic
        let isEditorMode = true;

        function toggleMode() {
            const editorView = document.getElementById('editor-view');
            const converterView = document.getElementById('converter-view');
            const formattingToolbar = document.getElementById('formatting-toolbar');
            const toggleBtn = document.getElementById('mode-toggle-btn');

            isEditorMode = !isEditorMode;

            if (isEditorMode) {
                // Switch to Editor Mode
                editorView.classList.remove('hidden');
                converterView.classList.add('hidden');
                formattingToolbar.classList.remove('hidden'); 
                
                toggleBtn.innerHTML = '<i class="fas fa-robot w-5 text-center text-lg"></i> এআই কনভার্টার চালু করুন';
                toggleBtn.className = "w-full flex items-center gap-3 px-4 py-2.5 text-sm text-indigo-700 hover:bg-indigo-100 font-bold transition";
            } else {
                // Switch to AI Converter Mode
                editorView.classList.add('hidden');
                converterView.classList.remove('hidden');
                formattingToolbar.classList.add('hidden'); 
                
                toggleBtn.innerHTML = '<i class="fas fa-pen w-5 text-center text-lg"></i> সরাসরি এডিটরে ফিরুন';
                toggleBtn.className = "w-full flex items-center gap-3 px-4 py-2.5 text-sm text-yellow-700 hover:bg-yellow-100 font-bold transition";
            }
            
            document.getElementById('action-dropdown').classList.add('hidden');
        }

        // Live Preview for AI Converter
        const aiInput = document.getElementById('ai-input');
        const aiOutput = document.getElementById('ai-output');

        aiInput.addEventListener('input', () => {
            aiOutput.innerHTML = aiInput.value.replace(/\n/g, '<br>');
            if(window.MathJax) {
                MathJax.typesetPromise([aiOutput]).catch((err) => console.log(err.message));
            }
        });

        // Helper for pasting text
        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                aiInput.value += text;
                aiInput.dispatchEvent(new Event('input'));
            } catch (err) {
                alert('ব্রাউজার ব্লক করেছে। দয়া করে বক্সে ট্যাপ/রাইট-ক্লিক করে পেস্ট করুন।');
            }
        }

        // Backend Connection for DOCX Download
        async function downloadDocx() {
            const text = isEditorMode ? 
                         document.getElementById('editor-view').innerText : 
                         document.getElementById('ai-input').value;         

            if (!text.trim()) {
                alert('কোনো লেখা নেই! আগে কিছু টাইপ বা পেস্ট করুন।');
                return;
            }

            const btn = document.getElementById('download-btn');
            const textSpan = document.getElementById('download-text');
            
            textSpan.innerText = 'কনভার্ট হচ্ছে...';
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.disabled = true;

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) throw new Error('সার্ভার এরর! Pandoc ব্যাকএন্ড ঠিকমতো রান করছে কি না চেক করুন।');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'SAHAL_TEC_Document.docx';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
                
            } catch (error) {
                alert('ডাউনলোড ব্যর্থ হয়েছে: ' + error.message);
            } finally {
                textSpan.innerText = 'ডাউনলোড';
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.disabled = false;
                document.getElementById('action-dropdown').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
